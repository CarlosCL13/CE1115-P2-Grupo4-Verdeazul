# Integracion continua. Corre en cada pull request y en cada empuje a main.
#
# Que NO hace: no toca Google Cloud. No publica imagenes ni despliega. Eso lo
# hace desplegar.yml, con federacion de identidad y sin archivo de credenciales.
#
# Por que importa que esto exista desde el primer dia: cuando un frente abre un
# pull request se corren las pruebas de los cinco. Si su cambio rompe algo de
# otro, se sabe antes de fusionar y no el 18 de noviembre.

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Minimo privilegio: el workflow solo necesita leer el codigo.
permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas de la matriz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install pytest

      # Las pruebas le preguntan al motor en 127.0.0.1:8181. Sin un OPA
      # encendido aqui, el fixture de sesion las salta todas y pytest sale con
      # 0: el check se ponia verde sin haber probado nada.
      #
      # La version sale del Dockerfile del motor, que es el que actualiza
      # Dependabot. Asi el numero vive en un solo lugar.
      - name: Instalar OPA
        run: |
          VERSION=$(sed -n 's|^FROM openpolicyagent/opa:\(.*\)-static.*|\1|p' services/policies/Dockerfile)
          echo "OPA $VERSION, segun services/policies/Dockerfile"
          curl -sSL -o opa "https://openpolicyagent.org/downloads/v$VERSION/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/

      # Si el motor no contesta en 30 segundos, el job falla en rojo y no se
      # llega a pytest. Esa es la proteccion contra el verde vacio.
      - name: Levantar el motor y esperarlo
        run: |
          opa run --server --addr=127.0.0.1:8181 services/policies/rego > opa.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8181/health > /dev/null && exit 0
            sleep 1
          done
          echo "El motor de politicas no respondio en 30 segundos"
          cat opa.log
          exit 1

      # El pythonpath lo fija pytest.ini, no una variable de entorno: asi
      # corre igual aqui que en la maquina de cada uno.
      - name: Cobertura de la matriz
        run: pytest tests/matriz -v

  # Identidad contra un PostgreSQL de verdad, con el mismo esquema y los mismos
  # roles que Neon, y contra el mismo OPA. Las pruebas de contrasenas, sesion,
  # segundo factor, C10 y datos personales necesitan la base: sin ella se
  # saltarian y el check quedaria verde sin haber probado nada.
  #
  # La base es desechable y entra con autenticacion trust, asi que no hay
  # ninguna contrasena en este archivo.
  identidad:
    name: Identidad contra PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: neondb_owner
          POSTGRES_DB: neondb
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neondb_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: neondb_owner
      VERDEAZUL_PRUEBAS_BD: postgresql://app_rw@localhost:5432/neondb
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install pytest

      - name: Instalar OPA
        run: |
          VERSION=$(sed -n 's|^FROM openpolicyagent/opa:\(.*\)-static.*|\1|p' services/policies/Dockerfile)
          curl -sSL -o opa "https://openpolicyagent.org/downloads/v$VERSION/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Levantar el motor y esperarlo
        run: |
          opa run --server --addr=127.0.0.1:8181 services/policies/rego > opa.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8181/health > /dev/null && exit 0
            sleep 1
          done
          cat opa.log
          exit 1

      - name: Esquema de verdeazul-app en la base desechable
        run: bash tests/identidad/preparar_bd.sh

      # -rs muestra cada prueba saltada. Si aparecen saltadas aqui, algo del
      # entorno fallo y el verde no vale.
      - name: Pruebas de identidad
        run: pytest tests/identidad -v -rs

      # Misma base y mismo motor. Fincas, periodos y mediciones: C1, C2, C3,
      # C7 y C8 contra el OPA real, y la inmutabilidad de las mediciones
      # contra los permisos reales de app_rw.
      - name: Pruebas de certificacion
        run: pytest tests/certificacion -v -rs

      # O4 enmiendas: C4, C5 y C11 contra el OPA real, y la maquina de
      # estados SOLICITADA -> REVISADA -> CERRADA | DEVUELTA.
      - name: Pruebas de enmiendas
        run: pytest tests/enmiendas -v -rs

      # O8 asignaciones: quien asigna, C1 en las lecturas, y que revocar o
      # vencer quita el acceso en la siguiente peticion.
      - name: Pruebas de asignaciones
        run: pytest tests/asignaciones -v -rs

      # O11 lee de una segunda base igual a verdeazul-bitacora, en el mismo
      # contenedor, con log_reader como en Neon. Tambien comprueba que
      # log_reader no puede insertar, cambiar ni borrar (frontera F6).
      - name: Esquema de verdeazul-bitacora en la base desechable
        run: bash tests/bitacora/preparar_bitacora.sh

      - name: Pruebas de bitacora
        env:
          VERDEAZUL_PRUEBAS_BITACORA: postgresql://log_reader@localhost:5432/bitacora_pruebas
          VERDEAZUL_PRUEBAS_BITACORA_DUENO: postgresql://neondb_owner@localhost:5432/bitacora_pruebas
        run: pytest tests/bitacora -v -rs

  # El transmisor y el backend se llaman los dos `app`, asi que sus pruebas
  # corren aparte, desde su carpeta y con su pytest.ini. Ninguna toca una
  # base: la bitacora es una sola y lo que entra ahi no se borra. La prueba
  # del vector fijo frena cualquier cambio que dejaria sin verificar los
  # eventos que ya estan en la cadena.
  transmisor:
    name: Transmisor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/transmisor
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Pruebas del transmisor
        run: pytest -v

  politicas:
    name: Politicas en Rego
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La misma version que el contenedor, leida del Dockerfile.
      - name: Instalar OPA
        run: |
          VERSION=$(sed -n 's|^FROM openpolicyagent/opa:\(.*\)-static.*|\1|p' services/policies/Dockerfile)
          echo "OPA $VERSION, segun services/policies/Dockerfile"
          curl -sSL -o opa "https://openpolicyagent.org/downloads/v$VERSION/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Formato de las politicas
        run: opa fmt --fail --list services/policies/rego

      - name: Pruebas de las politicas
        run: opa test services/policies/rego -v

  imagenes:
    name: Construir imagenes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        componente: [api, edge, policies, transmisor]
    steps:
      - uses: actions/checkout@v7

      # Se construye sin publicar. El enunciado exige que la imagen construya
      # sin intervencion manual (§3.2) y esto es justo lo que lo comprueba.
      - name: docker build ${{ matrix.componente }}
        run: docker build -t verdeazul-${{ matrix.componente }}:ci services/${{ matrix.componente }}

  secretos:
    name: Buscar credenciales versionadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks necesita el historial completo: el valor de esto es
          # detectar una credencial que se subio y despues se borro.
          fetch-depth: 0

      # §7.1: una credencial en el repositorio hace perder el total del
      # criterio de secretos, aunque el sistema funcione. Y el historial de git
      # conserva lo que se borra despues, asi que esto va sobre el historial.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}