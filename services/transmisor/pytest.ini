# Pruebas del transmisor. Van aparte de las de la raiz porque el transmisor
# y el backend se llaman los dos `app`, y en una misma corrida de pytest solo
# uno de los dos puede ser `app`.
#
#   pytest -c services/transmisor/pytest.ini
#
# Ninguna toca una base: la bitacora es una sola y lo que se inserta ahi no se
# puede borrar.

[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
