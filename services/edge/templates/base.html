<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Verdeazul Carbono{% endblock %}</title>
  <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
  <header>
    <a class="marca" href="{{ '/panel' if sesion else '/' }}"><strong>Verdeazul Carbono</strong></a>
    <nav>
      {% if sesion %}
        <span class="rol">{{ sesion.usuario }} · {{ sesion.rol }}</span>
        <a href="/panel">Panel</a>
        <form method="post" action="/salir" class="en-linea">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button>Salir</button>
        </form>
      {% else %}
        <a href="/verificar">Verificar un certificado</a>
        <a href="/entrar">Entrar</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block contenido %}{% endblock %}
  </main>

  <footer>
    Plataforma de certificación de captura de carbono · versión {{ version }}
  </footer>
</body>
</html>
