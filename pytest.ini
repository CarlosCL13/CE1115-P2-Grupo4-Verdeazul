# Configuracion de las pruebas. Esta aqui para que `pytest` funcione desde la
# raiz sin que nadie tenga que exportar PYTHONPATH a mano, ni en su maquina ni
# en la integracion continua.

[pytest]
testpaths = tests

# El codigo del backend vive en services/api, asi que `from app.authz import
# puede` funciona desde cualquier prueba.
pythonpath = services/api

# -ra muestra el resumen de xfail y skip al final. Importante aqui: ese
# resumen es el avance de la matriz, una linea por celda que todavia no esta
# implementada.
addopts = -ra --strict-markers
