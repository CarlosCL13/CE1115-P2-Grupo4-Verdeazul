# Pruebas del servicio de borde. Van aparte porque el borde, el backend y el
# transmisor se llaman los tres `app`, y en una corrida de pytest solo uno
# puede serlo. Se corren desde esta carpeta:
#
#   cd tests/borde && pytest
#
# Estan fuera de services/ a proposito: cambiar algo ahi redespliega.

[pytest]
testpaths = .
pythonpath = ../../services/edge
addopts = -ra --strict-markers -p no:cacheprovider
